<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#061827">
  <meta name="description" content="Ein Adventskalender voller kleiner Quizze und Überraschungen.">
  <title>Dein Adventskalender</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <div class="ambient ambient--ice" aria-hidden="true"></div>
  <div class="ambient ambient--blue" aria-hidden="true"></div>
  <div class="snowfall" aria-hidden="true">
    <span>❄</span><span>❄</span><span>❄</span><span>❄</span><span>❄</span><span>❄</span>
    <span>❄</span><span>❄</span><span>❄</span><span>❄</span><span>❄</span><span>❄</span>
    <span>❄</span><span>❄</span><span>❄</span><span>❄</span><span>❄</span><span>❄</span>
  </div>

  <main class="page-shell">
    <header class="hero">
      <h1>Quiz <span>Adventskalender</span></h1>
    </header>

    <section class="scoreboard glass-panel" aria-label="Dein Punktestand">
      <span class="score-label">Dein Punktestand</span>
      <strong class="score-value" id="score">0</strong>
      <span class="score-unit">PUNKTE</span>
    </section>

    <section class="calendar-section" aria-labelledby="calendar-heading">
      
      <section class="calendar" id="calendar" aria-label="Adventskalender-Türchen"></section>
    </section>

    <footer class="page-footer">
      <span class="footer-heart" aria-hidden="true">♥</span>
      <p>Für meinen Noob </p>
      <span class="footer-heart" aria-hidden="true">♥</span>
    </footer>
  </main>

  <div class="overlay" id="overlay" hidden>
    <section class="dialog glass-panel" role="dialog" aria-modal="true" aria-labelledby="dialog-title">
      <button class="close-button" id="close-dialog" type="button" aria-label="Türchen schließen">×</button>
      <header class="dialog-header">
        <p class="dialog-day" id="dialog-day"></p>
        <h2 id="dialog-title"></h2>
        <span class="dialog-ornament" aria-hidden="true">✦</span>
      </header>
      <div class="dialog-content" id="dialog-content"></div>
    </section>
  </div>

  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Vergrößertes Bild" hidden>
    <button class="close-button lightbox-close" id="close-lightbox" type="button" aria-label="Bild schließen">×</button>
    <img class="lightbox-image" id="lightbox-image" alt="">
  </div>

  <p class="storage-warning" id="storage-warning" role="alert" hidden></p>
</body>
</html>
